<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Trends Dashboard & Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body { background-color: #f8f9fa; color: #202124; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .active-tab { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.8rem; }
        .doc-section { margin-bottom: 2.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <h1 class="text-xl font-bold text-gray-800">Health <span class="text-blue-600">Trends</span></h1>
                <nav class="flex gap-6 h-full">
                    <button onclick="switchTab('explore')" id="tab-explore" class="py-2 active-tab transition-all">Explore</button>
                    <button onclick="switchTab('docs')" id="tab-docs" class="py-2 text-gray-500 hover:text-blue-600 transition-all">Documentation</button>
                </nav>
            </div>
            <!-- Identity Note -->
            <div class="text-xs text-gray-400 font-mono hidden md:block">
                Discovery v1beta Active
            </div>
        </div>
    </header>

    <!-- EXPLORE VIEW -->
    <main id="view-explore" class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        
        <!-- Search Controls -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="flex flex-col md:flex-row gap-6 items-end mb-6">
                <div class="flex-grow w-full">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Search Terms (Comma separated)</label>
                    <input type="text" id="terms" value="chickenpox, flu" class="w-full text-xl border-b-2 border-blue-500 focus:border-blue-700 p-2 outline-none bg-transparent transition-colors">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Geo</label>
                    <input type="text" id="geo" value="GB" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Start</label>
                    <input type="date" id="start" value="2023-01-01" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent text-sm">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">End</label>
                    <input type="date" id="end" value="2024-01-01" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent text-sm">
                </div>
                <button onclick="runQuery()" id="btn" class="w-full md:w-auto bg-blue-600 text-white font-medium py-3 px-8 rounded-lg hover:bg-blue-700 shadow-md transition-all whitespace-nowrap">
                    Explore
                </button>
            </div>
            
            <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
                <input type="checkbox" id="normalizeAvg" onchange="updateChart()" class="w-4 h-4 text-blue-600 border-gray-300 rounded cursor-pointer">
                <label for="normalizeAvg" class="text-sm font-medium text-gray-700 cursor-pointer select-none">
                    Normalize to Average (Baseline = 100%)
                </label>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-medium text-gray-800 mb-4" id="chartTitle">Interest over time</h2>
            <div class="w-full h-[450px]">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>

        <!-- Status & Raw Data -->
        <div id="status" class="hidden mb-4 p-3 text-sm font-medium rounded-md"></div>
        <details class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <summary class="p-4 font-medium text-gray-700 bg-gray-50 hover:bg-gray-100 transition cursor-pointer outline-none">
                View Raw JSON
            </summary>
            <div class="border-t border-gray-200">
                <pre id="output" class="p-4">Run a query to see raw data...</pre>
            </div>
        </details>
    </main>

    <!-- DOCUMENTATION VIEW -->
    <main id="view-docs" class="hidden flex-grow p-4 md:p-8 max-w-4xl mx-auto w-full">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-3xl font-bold mb-2">API Reference</h2>
            <p class="text-gray-500 mb-8 italic">Dynamically generated from Google Trends Discovery v1beta</p>
            <div id="docs-content" class="space-y-8">
                <div class="animate-pulse">Loading Discovery Data...</div>
            </div>
        </div>
    </main>

    <script>
        // *** CONFIGURATION ***
        const WORKER_URL = "https://trends.pwlewis.workers.dev";
        const DISCOVERY_URL = "https://trends.googleapis.com/$discovery/rest?version=v1beta";
        
        let trendsChart = null;
        let currentData = null; 
        let discoveryDoc = null;
        const chartColors = ['#4285F4', '#DB4437', '#F4B400', '#0F9D58', '#AB47BC', '#00ACC1'];

        // On Load: Fetch Discovery
        window.onload = async () => {
            try {
                const res = await fetch(DISCOVERY_URL);
                discoveryDoc = await res.json();
                buildDocs();
            } catch (e) {
                console.error("Discovery Failed", e);
            }
        };

        async function runQuery() {
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerHTML = "Querying...";
            status.className = "hidden";

            // Determine Endpoint path from Discovery
            const apiPath = discoveryDoc?.methods?.getTimelinesForHealth?.flatPath || "v1beta/timelinesForHealth";

            const payload = {
                path: apiPath,
                terms: document.getElementById('terms').value,
                start: document.getElementById('start').value,
                end: document.getElementById('end').value,
                geo: document.getElementById('geo').value || "GB",
                resolution: "day"
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                output.innerText = JSON.stringify(data, null, 4);

                if (response.ok) {
                    currentData = data;
                    renderChart();
                    showStatus("Success: Data updated.", "success");
                } else {
                    showStatus("API Error: " + (data.error || "Unknown error"), "error");
                }
            } catch (err) {
                showStatus("Network Error: Check Worker URL and CORS.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Explore";
            }
        }

        function updateChart() { if (currentData) renderChart(); }

        function renderChart() {
            if (!currentData?.lines) return;
            const ctx = document.getElementById('trendsChart').getContext('2d');
            const isNormalized = document.getElementById('normalizeAvg').checked;
            
            document.getElementById('chartTitle').innerText = isNormalized 
                ? "Interest over time (Normalized to 100% Avg)" 
                : "Interest over time (Raw Scaled Probability)";

            const labels = currentData.lines[0].points.map(p => p.date);
            const datasets = currentData.lines.map((line, idx) => {
                let baseline = 1;
                if (isNormalized) {
                    const sum = line.points.reduce((a, b) => a + b.value, 0);
                    baseline = sum / line.points.length || 1;
                }

                return {
                    label: line.term,
                    data: line.points.map(p => isNormalized ? Math.round((p.value / baseline) * 100) : p.value),
                    borderColor: chartColors[idx % chartColors.length],
                    backgroundColor: chartColors[idx % chartColors.length],
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2
                };
            });

            if (trendsChart) trendsChart.destroy();
            trendsChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: v => isNormalized ? v + '%' : v } }
                    }
                }
            });
        }

        function buildDocs() {
            const method = discoveryDoc.methods.getTimelinesForHealth;
            const container = document.getElementById('docs-content');
            
            container.innerHTML = `
                <div class="doc-section">
                    <h3 class="text-lg font-bold text-gray-700 uppercase tracking-tighter mb-2">Primary Endpoint</h3>
                    <code class="block bg-gray-100 p-4 rounded text-blue-700 font-mono">GET trends.googleapis.com/${method.flatPath}</code>
                    <p class="mt-3 text-gray-600 leading-relaxed">${method.description}</p>
                </div>

                <div class="doc-section">
                    <h3 class="text-lg font-bold text-gray-700 uppercase tracking-tighter mb-4">Parameters</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="border-b bg-gray-50"><th class="p-3">Key</th><th class="p-3">Description</th></tr></thead>
                            <tbody>
                                ${Object.entries(method.parameters).map(([k, v]) => `
                                    <tr class="border-b hover:bg-gray-50 transition">
                                        <td class="p-3 font-mono text-blue-600 font-bold">${k}</td>
                                        <td class="p-3 text-gray-600 text-sm">${v.description}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-lg font-bold text-gray-700 uppercase tracking-tighter mb-4">Response Object (Schema)</h3>
                    <pre><code>${JSON.stringify(discoveryDoc.schemas.TimelineResponse, null, 2)}</code></pre>
                </div>
            `;
        }

        function switchTab(tab) {
            document.getElementById('view-explore').classList.toggle('hidden', tab !== 'explore');
            document.getElementById('view-docs').classList.toggle('hidden', tab !== 'docs');
            document.getElementById('tab-explore').className = tab === 'explore' ? 'py-2 active-tab' : 'py-2 text-gray-500';
            document.getElementById('tab-docs').className = tab === 'docs' ? 'py-2 active-tab' : 'py-2 text-gray-500';
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.className = `p-3 text-sm font-medium rounded-md mb-4 ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
        }
    </script>
</body>
</html>
