<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Trends Explore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body { background-color: #f8f9fa; color: #202124; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="text-xl font-medium text-gray-600">
                <span class="text-blue-600 font-bold">Health</span> Trends <span class="text-sm font-normal text-gray-400 border border-gray-200 rounded px-1">Explorer</span>
            </div>
        </div>
        
        <!-- Auth Settings Toggle -->
        <div class="relative">
            <button onclick="toggleAuthPanel()" class="flex items-center gap-2 text-sm text-gray-600 hover:text-blue-600 font-medium px-3 py-2 rounded-md hover:bg-gray-50 transition">
                <span>⚙️ API Settings</span>
            </button>
        </div>
    </header>

    <!-- Hidden Auth Panel (Slides down) -->
    <div id="authPanel" class="hidden bg-white border-b border-gray-200 p-6 shadow-sm">
        <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 border border-blue-100 bg-blue-50 rounded-lg">
                <h3 class="font-bold text-blue-800 mb-2">🔒 Admin (Authenticator)</h3>
                <input type="text" id="totpCode" maxlength="6" placeholder="6-Digit TOTP Code" class="w-full border border-blue-200 p-2 rounded focus:ring-2 focus:ring-blue-500 font-mono tracking-widest outline-none">
            </div>
            <div class="p-4 border border-gray-200 bg-gray-50 rounded-lg">
                <h3 class="font-bold text-gray-700 mb-2">🔑 Public (API Key)</h3>
                <input type="password" id="userApiKey" placeholder="AIzaSy..." class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-gray-400 font-mono text-sm outline-none">
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-4">Provide ONE of the above to authenticate your query.</p>
    </div>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        
        <!-- Google Trends Style Search Bar -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-grow w-full">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Search Terms (Compare up to 5)</label>
                    <input type="text" id="terms" value="chickenpox, flu" class="w-full text-xl border-b-2 border-blue-500 focus:border-blue-700 p-2 outline-none bg-transparent transition-colors">
                </div>
                <div class="w-full md:w-48">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Location</label>
                    <input type="text" id="geo" value="GB" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Start</label>
                    <input type="date" id="start" value="2023-01-01" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent text-sm">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">End</label>
                    <input type="date" id="end" value="2024-01-01" class="w-full border-b border-gray-300 focus:border-blue-500 p-2 outline-none bg-transparent text-sm">
                </div>
                <button onclick="runQuery()" id="btn" class="w-full md:w-auto bg-blue-600 text-white font-medium py-2 px-6 rounded-full hover:bg-blue-700 shadow-sm transition-colors whitespace-nowrap">
                    Explore
                </button>
            </div>
        </div>

        <!-- System Status -->
        <div id="status" class="hidden mb-4 p-3 text-sm font-medium rounded-md"></div>

        <!-- Chart Container -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-medium text-gray-800 mb-4">Interest over time</h2>
            <div class="w-full h-[400px]">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>

        <!-- Raw Data Toggle -->
        <details class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden cursor-pointer">
            <summary class="p-4 font-medium text-gray-700 bg-gray-50 hover:bg-gray-100 transition outline-none">
                View Raw JSON Response
            </summary>
            <div class="border-t border-gray-200">
                <pre id="output" class="p-4 text-xs font-mono text-gray-600 overflow-auto max-h-96">Run a query to see data...</pre>
            </div>
        </details>

    </main>

    <script>
        // *** CRITICAL: REPLACE THIS WITH YOUR WORKER URL ***
        const WORKER_URL = "https://trends.pwlewis.workers.dev";
        
        let trendsChart = null;
        
        // Google Trends standard colors
        const chartColors = ['#4285F4', '#DB4437', '#F4B400', '#0F9D58', '#AB47BC', '#00ACC1'];

        function toggleAuthPanel() {
            const panel = document.getElementById('authPanel');
            panel.classList.toggle('hidden');
        }

        async function runQuery() {
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            const totpCode = document.getElementById('totpCode').value.trim();
            const userApiKey = document.getElementById('userApiKey').value.trim();

            // Set up Authentication Headers
            let requestHeaders = { 'Content-Type': 'application/json' };
            if (totpCode) {
                requestHeaders['Authorization'] = `Bearer ${totpCode}`;
            } else if (userApiKey) {
                requestHeaders['X-API-Key'] = userApiKey;
            } else {
                showStatus("Error: Please open ⚙️ API Settings and provide a code or key.", "error");
                return;
            }

            // UI State
            btn.disabled = true;
            btn.innerHTML = "Loading...";
            status.classList.add('hidden');
            output.innerText = "Fetching...";

            const payload = {
                terms: document.getElementById('terms').value,
                start: document.getElementById('start').value,
                end: document.getElementById('end').value,
                geo: document.getElementById('geo').value || "US",
                resolution: "week"
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: requestHeaders,
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                output.innerText = JSON.stringify(data, null, 4);

                if (response.ok) {
                    showStatus("Data retrieved successfully.", "success");
                    renderChart(data);
                    // Clear TOTP code after use for security
                    if(totpCode) document.getElementById('totpCode').value = '';
                } else {
                    showStatus("API Error: " + (data.error || "Request failed"), "error");
                }
            } catch (err) {
                showStatus("Network Error: Could not reach the Gateway.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Explore";
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            const lines = data.lines || [];

            if (lines.length === 0) return;

            // 1. Find the global maximum value across all terms to normalize to 100
            let globalMax = 0;
            lines.forEach(line => {
                line.points.forEach(point => {
                    if (point.value > globalMax) globalMax = point.value;
                });
            });

            // 2. Format the datasets for Chart.js
            // Assuming all terms share the same date timeline (standard API behavior)
            const labels = lines[0].points.map(p => {
                // Convert Google's "Jan 01 2024" string to a cleaner format if desired, or keep as is
                return p.date; 
            });

            const datasets = lines.map((line, index) => {
                // Normalize data: (value / max) * 100
                const normalizedData = line.points.map(p => {
                    return globalMax > 0 ? Math.round((p.value / globalMax) * 100) : 0;
                });

                return {
                    label: line.term,
                    data: normalizedData,
                    borderColor: chartColors[index % chartColors.length],
                    backgroundColor: chartColors[index % chartColors.length],
                    borderWidth: 2,
                    pointRadius: 1, // small dots like GTrends
                    pointHoverRadius: 5,
                    tension: 0.3 // Smooth curves
                };
            });

            // 3. Destroy existing chart if running a new query
            if (trendsChart) {
                trendsChart.destroy();
            }

            // 4. Draw the new chart
            trendsChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        y: {
                            min: 0,
                            max: 100, // Google Trends is always 0-100
                            grid: { drawBorder: false },
                            ticks: { stepSize: 25 }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 10 }
                        }
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            titleColor: '#000',
                            bodyColor: '#555',
                            borderColor: '#ddd',
                            borderWidth: 1,
                            padding: 10,
                            boxPadding: 4,
                            usePointStyle: true,
                        },
                        legend: {
                            position: 'top',
                            labels: { usePointStyle: true, boxWidth: 8 }
                        }
                    }
                }
            });
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                el.classList.add('bg-green-100', 'text-green-800');
            } else {
                el.classList.add('bg-red-100', 'text-red-800');
            }
        }
    </script>
</body>
</html>
